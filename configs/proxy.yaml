# Proxy configuration
# This file will grow significantly as features are added (Days 2-15).
# For now, it defines the minimal settings used by Day 1 programs.

server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 15s

# Backend defaults (expanded on Day 2)
backend:
  name: "backend-1"
  port: 9001

# Logging
logging:
  level: "info"     # debug, info, warn, error
  format: "json"    # json or text
